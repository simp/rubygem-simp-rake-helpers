# Run all tests as GitHub Actions
name: PR Tests
on:
  push:
    branches:
      # A test branch for seeing if your tests will pass in your personal fork
      - test_me_github
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  spec:
    runs-on:
      - ubuntu-latest
    strategy:
      matrix:
        puppet:
          # openvox 8 accepts openfact 6, but no OpenVox 8 AIO package ships it
          - label: 'OpenVox 8.x (Ruby 3.2)'
            puppet_version: '~> 8.0'
            openfact_version: '~> 5.0'
            ruby_version: '3.2.11'  # renovate: datasource=ruby-version depName=ruby
            experimental: false
          - label: 'OpenVox 9.x (Ruby 4.0)'
            puppet_version: '~> 9.0'
            openfact_version: '~> 6.0'
            ruby_version: '4.0.9'  # renovate: datasource=ruby-version depName=ruby
            experimental: false
      fail-fast: false
    env:
      PUPPET_VERSION: '${{matrix.puppet.puppet_version}}'
      OPENFACT_VERSION: '${{matrix.puppet.openfact_version}}'
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby ${{matrix.puppet.ruby_version}}'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{matrix.puppet.ruby_version}}
          bundler-cache: true
      - run: 'command -v rpm || if command -v apt-get; then sudo apt-get update; sudo apt-get install -y rpm; fi ||:'
      - run: 'bundle exec rake spec'
        continue-on-error: ${{matrix.puppet.experimental}}
      - name: gem build
        run: bundle exec rake pkg:install_gem
        continue-on-error: ${{matrix.puppet.experimental}}

  ruby-style:
    name: 'Ruby Style'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 'Install Ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - run: bundle exec rubocop

  acceptance:
    runs-on:
      - ubuntu-latest
    strategy:
      matrix:
        platform:
          - label: 'AlmaLinux 8'
            experimental: false
            nodeset: almalinux8
          - label: 'AlmaLinux 9'
            experimental: false
            nodeset: almalinux9
          - label: 'AlmaLinux 10'
            experimental: false
            nodeset: almalinux10
      fail-fast: false
    env:
      PUPPET_VERSION: '~> 8.0'
      # Install the OpenVox agent (not Puppet) on the SUT. simp-beaker-helpers'
      # get_puppet_install_info resolves the agent version straight from
      # PUPPET_VERSION and never consults the nodeset's puppet_collection, so it
      # would otherwise default to the `puppet8` collection and pull from
      # yum.puppet.com -- which has no EL10 release (404). Pinning the collection
      # here routes the install through yum.voxpupuli.org, which ships EL8/9/10.
      BEAKER_PUPPET_COLLECTION: openvox8
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
      - name: ensure entropy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rng-tools
          sudo systemctl start rng-tools
      - name: install bundler
        run: |
          gem install bundler
          bundle update
      - name: install docker
        run: |
          set -x
          sudo apt-get remove -y docker docker-engine docker.io containerd runc ||:
          sudo apt-get update -y
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg-agent software-properties-common
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
          sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          sudo apt-get update -y
          sudo apt-cache gencaches
          sudo apt-get install -y docker-ce
          sudo systemctl start docker
      - name: beaker
        env:
          NODESET: ${{matrix.platform.nodeset}}
        run: bundle exec rake beaker:suites[default,$NODESET]
        continue-on-error: ${{matrix.platform.experimental}}

  # The one check for branch protection to require: GitHub only blocks a
  # merge on checks listed by name, and this job fails unless every job it
  # needs succeeded. Add any new job in this workflow to `needs:`.
  all-checks:
    name: 'All checks'
    if: always()
    needs:
      - spec
      - ruby-style
      - acceptance
    runs-on: ubuntu-latest
    steps:
      - name: 'Fail unless every needed job succeeded'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<< "$NEEDS" > /dev/null
